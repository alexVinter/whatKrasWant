# Reverse proxy for the local development environment.
#   /      -> frontend (Vite dev server)
#   /api   -> backend (NestJS)
# TLS is intentionally not configured here; production TLS comes later.

server {
    listen 80;
    server_name localhost;

    # Emit relative redirects so the proxied port is preserved in dev.
    absolute_redirect off;

    # Backend API (NestJS). The /api prefix is stripped before proxying.
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend (Vite dev server). Upgrade headers allow HMR websockets.
    location / {
        proxy_pass http://web:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
